<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title data-i18n="title">重力四子棋 · Connect Four</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1 data-i18n="appTitle">重力四子棋</h1>
        <p class="subtitle" data-i18n="subtitle">Connect Four · 6×7 棋盘 · 人机对战</p>
      </header>

      <section class="controls card">
        <label class="control">
          <span data-i18n="difficultyLabel">AI 难度</span>
          <select id="difficulty" data-i18n-title="difficultyTitle" title="切换后对 AI 的下一步落子立即生效">
            <option value="easy" data-i18n="difficultyEasy">简单</option>
            <option value="medium" data-i18n="difficultyMedium">普通</option>
            <option value="hard" selected data-i18n="difficultyHard">困难</option>
          </select>
        </label>
        <label class="control">
          <span data-i18n="firstPlayerLabel">先手方</span>
          <select id="first-player" data-i18n-title="firstPlayerTitle" title="点击「新对局」时生效">
            <option value="human" selected data-i18n="firstHuman">我（红）</option>
            <option value="ai" data-i18n="firstAi">AI（黄）</option>
          </select>
        </label>
        <label class="control">
          <span data-i18n="languageLabel">语言</span>
          <select id="language">
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <button id="new-game" class="btn primary" type="button" data-i18n="newGame">新对局</button>
        <div class="score" id="score" data-i18n-title="scoreTitle" title="你 : AI（平局数）">你 0 : 0 AI · 平 0</div>
      </section>

      <section class="status human" id="status">轮到你了 · 红子</section>

      <section class="board-zone">
        <div class="ghost-row" id="ghost-row" aria-hidden="true"></div>
        <div class="board" id="board" data-i18n-title="boardTitle" title="点击某一列落下棋子"></div>
      </section>

      <footer class="hint" data-i18n="hint">棋子从顶部投入后落至该列最底部 · 横、竖、斜先连成四子者获胜</footer>

      <footer class="page-footer">
        <a
          class="repo-link"
          href="https://github.com/dynilath/con-four"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="currentColor">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          <span data-i18n="repoLink">在 GitHub 查看源码</span>
        </a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
